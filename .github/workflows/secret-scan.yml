name: Secret Scan
on:
  pull_request:
  push:
    branches: [main]

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Betterleaks
        env:
          BETTERLEAKS_VERSION: '1.8.1'
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${RUNNER_TEMP}/betterleaks.tar.gz"
          sudo tar -xzf "${RUNNER_TEMP}/betterleaks.tar.gz" -C /usr/local/bin betterleaks
          betterleaks version

      - name: Scan
        run: |
          betterleaks git . \
            --report-format sarif \
            --report-path betterleaks.sarif \
            --exit-code 1

      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('betterleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: betterleaks.sarif
